name: Apply v1 improvements
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Mensagem do commit"
        required: false
        default: "site: reaplicar patch_v1.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch (idempotente, com verificacao)
        run: python3 patch_v1.py

      - name: Commit
        env:
          MSG: ${{ github.event.inputs.message }}
        run: |
          git config user.name "slc-patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A site
          git commit -m "${MSG:-site: reaplicar patch_v1.py}" -m "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01FBkoNHxX7j49mDqu3TMmWY" || echo "nada novo"
          git push
